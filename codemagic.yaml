
workflows:
  whatsapp-siri-fix:
    name: Build WhatsApp Siri Entitlement Patch
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: latest

    scripts:
      - name: Initialize submodules
        script: git submodule update --init --recursive

      - name: Configure build
        script: cmake -B build-cmake

      - name: Compile
        script: cmake --build build-cmake --parallel 4

    artifacts:
      - build-cmake/**/*.dylib
      - build/**/*.dylib
